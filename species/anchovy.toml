# Anchovies of the genus Engraulis other than anchoveta: European (E. encrasicolus), Japanese (E. japonicus),
# northern (E. mordax), Cape (E. capensis), Argentine (E. anchoita) and Australian (E. australis). Temperate
# forage fish of both hemispheres, added 2026-09-26 so southern shelves are not empty niches to invade.
name = "anchovy"
group = "forage"   # dashboard grouping only; the model ignores it
color = "#5fa2dd"
length_weight = [0.0085, 3.05]
L_inf = 18.0
L_juv = 3.0
lifespan_days = 1300
egg_days = 2.5
T_ref = 16.0
cmax = 0.11
alpha = 0.7
K_food = 0.06
f_crit = 0.2
c_swim = 0.3
reserve_max = 0.3
kappa_R = 0.7
gonad_frac = 0.08
spawn_doy = [90, 270]  # day-of-year window (spring-summer in the north; the south shifts via spawn_shift)
spawning_grounds = [[-3.0, 45.0], [5.0, 42.0], [33.0, 44.0], [18.0, -33.0], [133.0, 34.0], [-119.0, 33.0], [-57.0, -38.0], [150.0, -34.0]]   # lon, lat
m0 = 0.006
m_early = 0.14
K_nursery = 8.0
