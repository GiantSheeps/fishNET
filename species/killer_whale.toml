# Killer whale (Orcinus orca) - apex predator of fish, squid, dolphins and whales; always individuals
# Size: males 8-9 m and ~6 t, females ~7 m and 4 t (W = 0.0117 L^3); calf 2.4 m, ~160 kg; mature ~5.5 m.
# Life history: lifespan 50-90 yr (females), calving every ~5 yr, adult survival ~0.98/yr (Olesiuk et al. 1990).
# Abundance at least 50,000 (Forney & Wade 2006).
name = "killer_whale"
group = "whales"   # dashboard grouping only; the model ignores it
feisty = "none"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#000000"
individual = true   # always an agent, never biomass (see Model.individualise)
mate_block_deg = 20.0   # ripe females find mates within this lat/lon block, not just their own cell
air_breathing = true   # lungs: no metabolic-index limit, no hypoxia mortality
endotherm = true   # no Q10 on intake and respiration
live_bearing = true   # the egg stage is a fetus/newborn: nothing eats it as plankton
egg_cannibalism = 0.0
length_weight = [0.0117, 3.0]
L_inf = 750.0
L_juv = 350.0
lifespan_days = 22000
egg_days = 2.0   # days from birth to the first feeding stage (gestation is paid through the gonad)
T_ref = 12.0
cmax = 0.2
alpha = 0.82
K_food = 0.05
f_crit = 0.2
c_swim = 0.3
reserve_max = 0.5
kappa_R = 0.4
gonad_frac = 0.05
spawn_doy = [1, 365]   # day-of-year window (wraps through New Year if start > end)
m0 = 0.0034
m_early = 0.0003
K_nursery = 0.4
K_adult = 1.5
m_thermal = 0.01
fishing_L50_L95 = [1000000000.0, 2000000000.0]
lat_sectors = ["tropical", "n_temperate", "s_temperate", "n_polar", "s_polar"]   # starting distribution only: animals may move anywhere afterwards
depth_range = [0, 300]   # m (clipped to the model's deepest level)
A_o = 0.9   # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.0
m_hypoxia = 0.0
larva_depth_max = 50
prey_size_ratio = 0.25
prey_size_sd = 1.2
plankton_L_max = 300.0   # cm: bigger animals no longer eat plankton
diet = {}
larva_diet = { krill = 0.5, zoo = 0.5 }
fish_diet = { herring = 0.8, bluefin_atlantic = 0.5, toothfish = 0.4, cod_atlantic = 0.4, jumbo_squid = 0.3, blue_shark = 0.3, common_dolphin = 0.4, bottlenose_dolphin = 0.2, minke_whale = 0.4, humpback_whale = 0.2, fin_whale = 0.1, blue_whale = 0.1 }

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [10.0, 1.5, 0.4]
T_width = [14.0, 1.4, 0.3]
speed = [0.4, 0.048, 0.3]
metab = [0.9, 0.1, 0.3]
L_mat = [550.0, 33.0, 0.4]
egg_mass = [160000.0, 19200.0, 0.3]
w_therm = [1.5, 1.0, 0.3]
w_food = [5.0, 1.0, 0.3]
w_risk = [0.0, 1.0, 0.3]
w_crowd = [1.0, 0.5, 0.3]
w_light = [-0.5, 0.5, 0.3]
w_home = [2.5, 0.5, 0.3]
w_shelf = [0.3, 0.5, 0.3]
spawn_shift = [0.0, 8.0, 0.3]
