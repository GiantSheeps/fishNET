# Sperm whale (Physeter macrocephalus) - deep-diving squid eater; always individuals
# Size: females ~11 m and 15 t, males 16-18 m and 45 t (W = 0.011 L^3); calf 4 m, ~0.7 t; mature females ~9 m.
# Life history: lifespan ~70 yr, one calf every 4-6 yr, adult survival ~0.97-0.98/yr (Whitehead 2003).
# Abundance ~360,000 (Whitehead 2002, MEPS 242:295). Eats on the order of 100 Mt of cephalopods a year.
name = "sperm_whale"
group = "whales"   # dashboard grouping only; the model ignores it
feisty = "none"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#525252"
individual = true   # always an agent, never biomass (see Model.individualise)
mate_block_deg = 20.0   # ripe females find mates within this lat/lon block, not just their own cell
air_breathing = true   # lungs: no metabolic-index limit, no hypoxia mortality
endotherm = true   # no Q10 on intake and respiration
live_bearing = true   # the egg stage is a fetus/newborn: nothing eats it as plankton
egg_cannibalism = 0.0
length_weight = [0.011, 3.0]
L_inf = 1500.0
L_juv = 600.0
lifespan_days = 25500
egg_days = 2.0   # days from birth to the first feeding stage (gestation is paid through the gonad)
T_ref = 12.0
cmax = 0.15
alpha = 0.82
K_food = 0.05
f_crit = 0.2
c_swim = 0.3
reserve_max = 0.5
kappa_R = 0.4
gonad_frac = 0.06
spawn_doy = [1, 365]   # day-of-year window (wraps through New Year if start > end)
m0 = 0.0073
m_early = 0.0003
K_nursery = 0.4
K_adult = 1.5
m_thermal = 0.01
fishing_L50_L95 = [1000000000.0, 2000000000.0]
lat_sectors = ["tropical", "n_temperate", "s_temperate", "n_polar", "s_polar"]   # starting distribution only: animals may move anywhere afterwards
depth_range = [0, 1500]   # m (clipped to the model's deepest level)
A_o = 0.9   # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.0
m_hypoxia = 0.0
larva_depth_max = 50
prey_size_ratio = 0.04
prey_size_sd = 1.5
plankton_L_max = 500.0   # cm: bigger animals no longer eat plankton
diet = {}
larva_diet = { krill = 0.5, zoo = 0.5 }
fish_diet = { jumbo_squid = 1.0, flying_squid = 0.9, shortfin_squid = 0.9, toothfish = 0.6, greenland_halibut = 0.3, hake = 0.2, lanternfish = 0.2 }

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [15.0, 1.5, 0.4]
T_width = [12.0, 1.2, 0.3]
speed = [0.12, 0.014, 0.3]
metab = [0.8, 0.1, 0.3]
L_mat = [900.0, 54.0, 0.4]
egg_mass = [700000.0, 84000.0, 0.3]
w_therm = [1.5, 1.0, 0.3]
w_food = [5.0, 1.0, 0.3]
w_risk = [-0.2, 1.0, 0.3]
w_crowd = [0.5, 0.5, 0.3]
w_light = [0.5, 0.5, 0.3]
w_home = [3.0, 0.5, 0.3]
w_shelf = [-1.0, 0.5, 0.3]
spawn_shift = [0.0, 8.0, 0.3]
