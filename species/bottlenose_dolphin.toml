# Common bottlenose dolphin (Tursiops truncatus) - coastal and shelf generalist
# Size: adults ~2.8 m and 200-300 kg (W = 0.012 L^3); calf ~1.1 m, 16 kg; weaned at ~1.6 m; mature ~2.4 m.
# Life history: lifespan ~40 yr, calving every 3-6 yr, adult survival ~0.93-0.96/yr (Wells & Scott 1990).
# Abundance at least 600,000 worldwide (NAMMCO; Wells & Scott 2009).
name = "bottlenose_dolphin"
group = "mammals"   # dashboard grouping only; the model ignores it
feisty = "none"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#e6ab02"
air_breathing = true   # lungs: no metabolic-index limit, no hypoxia mortality
endotherm = true   # no Q10 on intake and respiration
live_bearing = true   # the egg stage is a fetus/newborn: nothing eats it as plankton
egg_cannibalism = 0.0
length_weight = [0.012, 3.0]
L_inf = 300.0
L_juv = 160.0
lifespan_days = 14600
egg_days = 2.0   # days from birth to the first feeding stage (gestation is paid through the gonad)
T_ref = 18.0
cmax = 0.22
alpha = 0.82
K_food = 0.05
f_crit = 0.2
c_swim = 0.8
reserve_max = 0.35
kappa_R = 0.45
gonad_frac = 0.1
spawn_doy = [60, 270]   # day-of-year window (wraps through New Year if start > end)
m0 = 0.0041
m_early = 0.0008
K_nursery = 0.3
K_adult = 1.0
m_thermal = 0.03
fishing_L50_L95 = [1000000000.0, 2000000000.0]
lat_sectors = ["tropical", "n_temperate", "s_temperate"]   # starting distribution only: animals may move anywhere afterwards
depth_range = [0, 300]   # m (clipped to the model's deepest level)
A_o = 0.9   # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.0
m_hypoxia = 0.0
larva_depth_max = 50
prey_size_ratio = 0.1
prey_size_sd = 1.6
plankton_L_max = 100.0   # cm: bigger animals no longer eat plankton
diet = {}
larva_diet = { krill = 0.8, zoo = 0.5 }
fish_diet = { hake = 0.6, sardine_eu = 0.6, anchovy = 0.6, herring = 0.5, sardinella = 0.5, flounder = 0.4, cod_atlantic = 0.3, flying_squid = 0.4, shortfin_squid = 0.4 }

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [20.0, 1.5, 0.4]
T_width = [7.0, 0.7, 0.3]
speed = [0.8, 0.096, 0.3]
metab = [1.0, 0.1, 0.3]
L_mat = [240.0, 14.4, 0.4]
egg_mass = [16000.0, 1920.0, 0.3]
w_therm = [2.5, 1.0, 0.3]
w_food = [5.0, 1.0, 0.3]
w_risk = [-1.0, 1.0, 0.3]
w_crowd = [1.0, 0.5, 0.3]
w_light = [-0.5, 0.5, 0.3]
w_home = [2.5, 0.5, 0.3]
w_shelf = [1.5, 0.5, 0.3]
spawn_shift = [0.0, 8.0, 0.3]
