# Minke whales (Balaenoptera acutorostrata and B. bonaerensis) - smallest rorquals, krill and fish; always individuals
# Size: adults 7-9 m, ~7 t at 8.5 m (W = 0.0114 L^3); calf 2.7 m, ~230 kg; weaned at ~4.5 m; mature ~7 m.
# Life history: lifespan ~50 yr, near-annual calving, adult survival ~0.95/yr (IWC).
# Abundance: Antarctic minke ~515,000 (IWC 2012) plus common minke ~200,000.
name = "minke_whale"
group = "whales"   # dashboard grouping only; the model ignores it
feisty = "none"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#6baed6"
individual = true   # always an agent, never biomass (see Model.individualise)
mate_block_deg = 20.0   # ripe females find mates within this lat/lon block, not just their own cell
air_breathing = true   # lungs: no metabolic-index limit, no hypoxia mortality
endotherm = true   # no Q10 on intake and respiration
live_bearing = true   # the egg stage is a fetus/newborn: nothing eats it as plankton
egg_cannibalism = 0.0
length_weight = [0.0114, 3.0]
L_inf = 850.0
L_juv = 450.0
lifespan_days = 18000
egg_days = 2.0   # days from birth to the first feeding stage (gestation is paid through the gonad)
T_ref = 12.0
cmax = 0.15
alpha = 0.82
K_food = 0.05
f_crit = 0.2
c_swim = 0.3
reserve_max = 0.5
kappa_R = 0.4
gonad_frac = 0.045
spawn_doy = [1, 365]   # day-of-year window (wraps through New Year if start > end)
m0 = 0.0068
m_early = 0.0004
K_nursery = 0.4
K_adult = 1.5
m_thermal = 0.01
fishing_L50_L95 = [1000000000.0, 2000000000.0]
lat_sectors = ["tropical", "n_temperate", "s_temperate", "n_polar", "s_polar"]   # starting distribution only: animals may move anywhere afterwards
depth_range = [0, 250]   # m (clipped to the model's deepest level)
A_o = 0.9   # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.0
m_hypoxia = 0.0
larva_depth_max = 50
prey_size_ratio = 0.004
prey_size_sd = 2.5
diet = { krill = 1.0, zoo = 0.3 }
larva_diet = { krill = 1.0 }
fish_diet = { capelin = 0.8, herring = 0.7, polar_cod = 0.5, silverfish = 0.5, sardine_eu = 0.3 }

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [6.0, 1.5, 0.4]
T_width = [12.0, 1.2, 0.3]
speed = [0.25, 0.03, 0.3]
metab = [0.85, 0.1, 0.3]
L_mat = [700.0, 42.0, 0.4]
egg_mass = [230000.0, 27600.0, 0.3]
w_therm = [1.5, 1.0, 0.3]
w_food = [5.0, 1.0, 0.3]
w_risk = [-0.5, 1.0, 0.3]
w_crowd = [0.0, 0.5, 0.3]
w_light = [-0.5, 0.5, 0.3]
w_home = [3.0, 0.5, 0.3]
w_shelf = [0.0, 0.5, 0.3]
spawn_shift = [0.0, 8.0, 0.3]
