larva_diet = {}
fish_diet = { skipjack = 0.8, swordfish = 0.6, albacore = 0.6, yellowfin = 0.5, bluefin_atlantic = 0.3, blue_shark = 0.3, flying_squid = 0.6, shortfin_squid = 0.6, jumbo_squid = 0.5, herring = 0.5, sardine_eu = 0.5, sardine_pacific = 0.5, anchovy = 0.4, hake = 0.4 }

