# Small pelagic planktivore (Sardina-like)
name = "sardine"
group = "forage"
feisty = "forage"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#1f77b4"
length_weight = [0.008, 3.1]     # W[g] = a L[cm]^b
L_inf = 24.0                      # cm, asymptotic length at feeding level f_ref and T_opt
L_juv = 3.5                       # larva -> juvenile (cm)
lifespan_days = 2900
egg_days = 3.0                    # egg duration at T_ref
T_ref = 15.0
cmax = 0.10                       # g^(1/3) d-1   (C_max = cmax W^(2/3))
alpha = 0.7                       # assimilation efficiency
K_food = 0.08                     # g m-3
f_crit = 0.2                      # critical feeding level (maintenance) at L_inf
c_swim = 0.3                      # respiration increase at the species-mean swim speed
reserve_max = 0.3                 # max reserve / structure
kappa_R = 0.7                     # adult surplus to gonads
gonad_frac = 0.08                 # spawn when gonad > gonad_frac x structure
spawn_doy = [20, 160]
# spawning_grounds unset: ripe fish home to their own birth place and to conspecific aggregations
m0 = 0.004                        # d-1 at 1 g (scales W^-1/4)
m_early = 0.12                    # extra egg/larva mortality d-1
K_nursery = 8.0                   # g m-2 of same-stage conspecific young at which their natural mortality doubles
m_thermal = 0.05
fishing_L50_L95 = [12.0, 16.0]
depth_range = [0, 150]
A_o = 0.45                        # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 2.5                    # metabolic index needed for full activity
m_hypoxia = 0.25                  # d-1 mortality when the index falls below 1
larva_depth_max = 80
prey_size_ratio = 0.01
prey_size_sd = 2.0   # broad: filter feeder
diet = { phyto = 0.5, zoo = 1.0 }   # taxonomic weights, multiplied by the size window
larva_diet = { phyto = 0.2, zoo = 1.0 }
fish_diet = { sardine = 0.2 }     # egg/larval cannibalism via the size window

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [16.0, 1.0, 0.4]
T_width = [4.0, 0.4, 0.3]
speed = [1.5, 0.2, 0.3]           # body lengths per second
metab = [1.0, 0.1, 0.3]
L_mat = [15.0, 1.0, 0.4]
egg_mass = [0.0012, 0.0002, 0.3]
w_therm = [4.0, 1.0, 0.3]
w_food = [4.0, 1.0, 0.3]
w_risk = [-3.0, 1.0, 0.3]
w_crowd = [1.0, 0.5, 0.3]
w_light = [-1.0, 0.5, 0.3]
w_home = [2.0, 0.5, 0.3]
w_shelf = [1.0, 0.5, 0.3]      # + shallow water, - open ocean (evolves)
spawn_shift = [0.0, 8.0, 0.3]   # days: heritable shift of the spawning window (temporal isolation)
