# Jumbo or Humboldt squid (Dosidicus gigas) - large ommastrephid predator of the eastern Pacific
# Size: mantle length (ML, the length used here) to ~100 cm; ~10 kg at 80 cm (W = 0.02 ML^3); matures at 30-80 cm.
# Life history: lives 1-2 yr, semelparous, spawns year round; strongly hypoxia tolerant (dives into the OMZ).
# Biomass: 0.1-1.7 Mt off Peru alone in IMARPE acoustic surveys 1999-2015; fishery takes 0.5-1 Mt a year.
name = "jumbo_squid"
group = "cephalopods"   # dashboard grouping only; the model ignores it
feisty = "none"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#e377c2"
length_weight = [0.02, 3.0]
L_inf = 100.0
L_juv = 1.0
lifespan_days = 550
egg_days = 4.0   # days from birth to the first feeding stage (gestation is paid through the gonad)
T_ref = 16.0
cmax = 0.35
alpha = 0.75
K_food = 0.04
f_crit = 0.2
c_swim = 0.6
reserve_max = 0.3
kappa_R = 0.7
gonad_frac = 0.12
spawn_doy = [1, 365]   # day-of-year window (wraps through New Year if start > end)
m0 = 0.008
m_early = 0.18
K_nursery = 2.0
K_adult = 8.0
m_thermal = 0.04
fishing_L50_L95 = [30.0, 50.0]
lat_sectors = ["tropical", "n_temperate", "s_temperate"]   # starting distribution only: animals may move anywhere afterwards
seed_range = [[-140.0, -90.0, -45.0, 40.0], [-90.0, -70.0, -45.0, 8.0]]
depth_sectors = ["epipelagic", "mesopelagic"]
A_o = 0.9   # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.4
m_hypoxia = 0.15
larva_depth_max = 80
prey_size_ratio = 0.08
prey_size_sd = 1.8
plankton_L_max = 20.0   # cm: bigger animals no longer eat plankton
diet = { zoo = 0.3, krill = 0.8 }
larva_diet = { zoo = 0.8, krill = 0.2 }
fish_diet = { lanternfish = 0.9, bristlemouth = 0.5, anchoveta = 0.6, sardine_pacific = 0.5, hake = 0.5, jumbo_squid = 0.3 }

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [18.0, 1.5, 0.4]
T_width = [6.0, 0.6, 0.3]
speed = [1.6, 0.192, 0.3]
metab = [1.1, 0.1, 0.3]
L_mat = [50.0, 3.0, 0.4]
egg_mass = [0.0005, 6e-05, 0.3]
w_therm = [3.0, 1.0, 0.3]
w_food = [5.0, 1.0, 0.3]
w_risk = [-2.5, 1.0, 0.3]
w_crowd = [0.5, 0.5, 0.3]
w_light = [-3.0, 0.5, 0.3]
w_home = [1.0, 0.5, 0.3]
w_shelf = [-0.5, 0.5, 0.3]
spawn_shift = [0.0, 8.0, 0.3]
