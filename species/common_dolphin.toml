# Common dolphin (Delphinus delphis) - the most abundant cetacean, schooling forage-fish hunter
# Size: adults ~2 m and 80-100 kg (W = 0.009 L^3.05); calf ~85 cm, 7 kg; weaned at ~1.2 m; mature ~1.8 m.
# Life history: lifespan ~25 yr, calving every 1-3 yr, adult survival ~0.9/yr (Murphy et al. 2009).
# Abundance ~6 million worldwide (NAMMCO; Hammond et al. 2008).
name = "common_dolphin"
group = "mammals"   # dashboard grouping only; the model ignores it
feisty = "none"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#d95f02"
air_breathing = true   # lungs: no metabolic-index limit, no hypoxia mortality
endotherm = true   # no Q10 on intake and respiration
live_bearing = true   # the egg stage is a fetus/newborn: nothing eats it as plankton
egg_cannibalism = 0.0
length_weight = [0.009, 3.05]
L_inf = 230.0
L_juv = 120.0
lifespan_days = 9000
egg_days = 2.0   # days from birth to the first feeding stage (gestation is paid through the gonad)
T_ref = 18.0
cmax = 0.22
alpha = 0.82
K_food = 0.05
f_crit = 0.2
c_swim = 0.8
reserve_max = 0.35
kappa_R = 0.45
gonad_frac = 0.11
spawn_doy = [60, 240]   # day-of-year window (wraps through New Year if start > end)
m0 = 0.0045
m_early = 0.0008
K_nursery = 0.3
K_adult = 1.0
m_thermal = 0.03
fishing_L50_L95 = [1000000000.0, 2000000000.0]
lat_sectors = ["tropical", "n_temperate", "s_temperate"]   # starting distribution only: animals may move anywhere afterwards
depth_range = [0, 300]   # m (clipped to the model's deepest level)
A_o = 0.9   # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.0
m_hypoxia = 0.0
larva_depth_max = 50
prey_size_ratio = 0.1
prey_size_sd = 1.6
plankton_L_max = 100.0   # cm: bigger animals no longer eat plankton
diet = {}
larva_diet = { krill = 0.8, zoo = 0.5 }
fish_diet = { anchovy = 0.9, sardine_eu = 0.8, sardine_pacific = 0.8, lanternfish = 0.7, sardinella = 0.6, herring = 0.6, anchoveta = 0.6, flying_squid = 0.5, shortfin_squid = 0.5, hake = 0.3 }

[traits]                          # [mean, phenotypic sd, heritability]
T_opt = [18.0, 1.5, 0.4]
T_width = [7.0, 0.7, 0.3]
speed = [1.2, 0.144, 0.3]
metab = [1.1, 0.1, 0.3]
L_mat = [180.0, 10.8, 0.4]
egg_mass = [7000.0, 840.0, 0.3]
w_therm = [2.5, 1.0, 0.3]
w_food = [5.0, 1.0, 0.3]
w_risk = [-1.5, 1.0, 0.3]
w_crowd = [1.5, 0.5, 0.3]
w_light = [-0.5, 0.5, 0.3]
w_home = [2.5, 0.5, 0.3]
w_shelf = [-0.3, 0.5, 0.3]
spawn_shift = [0.0, 8.0, 0.3]
