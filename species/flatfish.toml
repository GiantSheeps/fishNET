# Benthic flatfish feeding on detritus and small zooplankton (Pleuronectes-like)
name = "flatfish"
group = "benthic"
feisty = "demersal"   # FEISTY functional type for src/feisty_compare.py (none = not represented in FEISTY)
color = "#9467bd"
length_weight = [0.01, 3.0]
L_inf = 45.0
L_juv = 2.5
lifespan_days = 5000
egg_days = 7.0
T_ref = 8.0
cmax = 0.12
alpha = 0.65
K_food = 0.06                    # g m-3 (benthic food is dilute as a water-column mean)
f_crit = 0.2                      # critical feeding level (maintenance) at L_inf
c_swim = 0.2
reserve_max = 0.3
kappa_R = 0.6
gonad_frac = 0.1
spawn_doy = [20, 100]
# spawning_grounds unset: ripe fish home to their own birth place and to conspecific aggregations
m0 = 0.003
m_early = 0.15
K_nursery = 1.5                   # g m-2 of same-stage conspecific young at which their natural mortality doubles
m_thermal = 0.05
fishing_L50_L95 = [22.0, 30.0]
depth_range = [25, 600]
demersal = true                   # lives on the sea bed (pinned to the bottom cell)
A_o = 0.6                        # metabolic index: oxygen supply per kPa (higher = more hypoxia tolerant)
phi_crit = 1.8                    # metabolic index needed for full activity
m_hypoxia = 0.15                  # d-1 mortality when the index falls below 1
larva_depth_max = 100
prey_size_ratio = 0.02
prey_size_sd = 1.5
diet = { zoo = 0.5, detritus = 1.0 }   # detritus = benthic food proxy
larva_diet = { zoo = 1.0 }
fish_diet = {}

[traits]
T_opt = [8.0, 1.0, 0.4]
T_width = [5.0, 0.5, 0.3]
speed = [0.5, 0.08, 0.3]
metab = [1.0, 0.1, 0.3]
L_mat = [28.0, 2.0, 0.4]
egg_mass = [0.002, 0.0004, 0.3]
w_therm = [4.0, 1.0, 0.3]
w_food = [4.0, 1.0, 0.3]
w_risk = [-2.0, 1.0, 0.3]
w_crowd = [0.0, 0.5, 0.3]
w_light = [0.0, 0.5, 0.3]
w_home = [0.0, 0.5, 0.3]
w_shelf = [3.0, 0.5, 0.3]      # + shallow water, - open ocean (evolves)
spawn_shift = [0.0, 8.0, 0.3]   # days: heritable shift of the spawning window (temporal isolation)
