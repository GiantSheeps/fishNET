# Sardinellas (genus Sardinella): Indian oil sardine, round and Madeiran sardinella, goldstripe, Brazilian
# sardinella. The tropical and subtropical small pelagics of the Indian Ocean, West Africa, SE Asia, the
# Caribbean and Brazil, added 2026-09-26 so those waters are not empty niches for temperate forage fish to invade.
name = "sardinella"
