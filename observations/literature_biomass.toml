# Starting biomass per fishNET species, used when [run] initial_biomass = "literature".
# Written by `python obsval.py --tables` on 2026-09-26. biomass_t is the global total in
# tonnes; the model spreads it as biomass_t x 1e6 / 3.6e+14 m2, the namelists' convention.
# Assessed species: the sum of their RAM Legacy stocks, which misses unassessed stocks (a lower bound).
# Validating against RAM after starting from RAM is partly circular: compare the end state, not the start.

